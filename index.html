<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisSSH | Live SSH Monitor</title>
    <style>
        :root { --bg: #050a18; --card: #0c152c; --border: #1b2c52; --cyan: #00f5d4; --crimson: #ff2a5f; --amber: #ffbe0b; --text: #f1f5f9; --muted: #8b9ec2; }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); }
        nav { background: #081024; border-bottom: 1px solid var(--border); padding: 15px 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: var(--text); text-decoration: none; }
        .logo span { color: var(--cyan); }
        .links { display: flex; gap: 12px; }
        .links a { color: var(--muted); text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .links a.active, .links a:hover { background: rgba(0, 245, 212, 0.12); color: var(--cyan); border: 1px solid rgba(0, 245, 212, 0.35); }
        .container { max-width: 1150px; margin: 28px auto; padding: 0 20px; }
        .banner { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--cyan); padding: 16px 22px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .banner.alert { border-left-color: var(--crimson); background: rgba(255, 42, 95, 0.1); }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 22px; }
        .m-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .m-card h3 { margin: 0; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; }
        .m-card .val { font-size: 34px; font-weight: 800; margin-top: 8px; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
        button { padding: 11px 18px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 13.5px; transition: 0.2s; }
        .btn-red { background: var(--crimson); color: white; box-shadow: 0 0 16px rgba(255, 42, 95, 0.35); }
        .btn-cyan { background: var(--cyan); color: #050a18; }
        .btn-dark { background: #142140; color: var(--text); border: 1px solid var(--border); }
        textarea { width: 100%; height: 95px; background: #040814; border: 1px solid var(--border); border-radius: 8px; color: var(--cyan); padding: 12px; font-family: Consolas, monospace; font-size: 13px; }
        .stream { background: #03060f; border: 1px solid var(--border); border-radius: 10px; padding: 16px; height: 240px; overflow-y: auto; font-family: Consolas, monospace; font-size: 13px; margin-top: 16px; line-height: 1.65; }
        .s-ok { color: var(--cyan); } .s-warn { color: var(--amber); } .s-crit { color: var(--crimson); font-weight: bold; }
    </style>
</head>
<body>
<nav>
    <a href="index.html" class="logo">AEGIS<span>SSH</span> // MONITOR</a>
    <div class="links">
        <a href="index.html" class="active">1. Live Monitor</a>
        <a href="firewall.html">2. Firewall & Whitelist</a>
        <a href="reports.html">3. Forensic Logs</a>
    </div>
</nav>

<div class="container">
    <div class="banner" id="statusBanner">
        <div><strong>PORT 22 STATUS:</strong> <span id="statusText" style="color:var(--cyan);">PROTECTED & LISTENING</span></div>
        <div style="font-size:13px; color:var(--muted);">Active Threshold: <strong id="ruleLabel" style="color:var(--cyan);">5 Failures</strong></div>
    </div>

    <div class="metrics">
        <div class="m-card"><h3>Failed Login Attempts</h3><div class="val" id="mFailed">0</div></div>
        <div class="m-card"><h3>Brute Force Alerts</h3><div class="val" style="color:var(--crimson);" id="mAlerts">0</div></div>
        <div class="m-card"><h3>Blocked Attacker IPs</h3><div class="val" style="color:var(--cyan);" id="mBlocked">0</div></div>
    </div>

    <div class="panel">
        <div class="actions">
            <button class="btn-red" onclick="simulateAttack()">⚡ Simulate Brute Force Attack</button>
            <button class="btn-cyan" onclick="scanLogs()">🔍 Scan SSH Log Input</button>
            <button class="btn-dark" onclick="clearLive()">Clear Terminal</button>
        </div>
        <textarea id="logBox" placeholder="Paste SSH authentication log lines here or click 'Simulate Brute Force Attack'..."></textarea>
        <div class="stream" id="terminalStream">
            <div class="s-ok">[ENGINE] AegisSSH Real-Time SSH Intrusion Detector initialized...</div>
        </div>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem("aegisState")) || { threshold: 5, whitelist: ["127.0.0.1"], blocked: [], incidents: [], failed: 0, alerts: 0 };
    let tracker = {};

    function saveState() { localStorage.setItem("aegisState", JSON.stringify(state)); updateUI(); }

    function updateUI() {
        document.getElementById("ruleLabel").innerText = state.threshold + " Failures";
        document.getElementById("mFailed").innerText = state.failed;
        document.getElementById("mAlerts").innerText = state.alerts;
        document.getElementById("mBlocked").innerText = state.blocked.length;
    }

    function printLine(txt, cls) {
        const el = document.getElementById("terminalStream");
        el.innerHTML += `<div class="${cls}">${txt}</div>`;
        el.scrollTop = el.scrollHeight;
    }

    function processLine(line) {
        if (!line.includes("Failed password")) return;
        const ipM = line.match(/from (\d+\.\d+\.\d+\.\d+)/);
        const usrM = line.match(/for (?:invalid user )?(\S+) from/);
        if (!ipM) return;

        const ip = ipM;
        const user = usrM ? usrM : "unknown";
        state.failed++;
        tracker[ip] = (tracker[ip] || 0) + 1;
        printLine(`[WARN] Failed SSH login | IP: ${ip} | User: '${user}' | Attempt ${tracker[ip]}/${state.threshold}`, "s-warn");

        if (tracker[ip] >= state.threshold && !state.blocked.includes(ip)) {
            state.alerts++;
            const sev = (user === "root" || user === "admin") ? "CRITICAL" : "HIGH";
            const act = state.whitelist.includes(ip) ? "ALERT ONLY (Whitelisted)" : "BLOCKED (iptables DROP)";
            if (!state.whitelist.includes(ip)) state.blocked.push(ip);

            document.getElementById("statusBanner").classList.add("alert");
            document.getElementById("statusText").style.color = "var(--crimson)";
            document.getElementById("statusText").innerText = `BREACH DETECTED FROM ${ip}`;
            printLine(`[🚨 ALERT] BRUTE FORCE CONFIRMED | IP: ${ip} | User: '${user}' | ${sev} -> ${act}`, "s-crit");

            state.incidents.unshift({ time: new Date().toLocaleString(), ip, user, sev, act });
        }
        saveState();
    }

    function scanLogs() { document.getElementById("logBox").value.split("\n").forEach(l => processLine(l)); }

    function simulateAttack() {
        const ip = `185.220.101.${Math.floor(Math.random() * 180) + 30}`;
        const lines = [];
        for (let i = 1; i <= state.threshold; i++) lines.push(`Nov 21 03:12:0${i} kali sshd[601${i}]: Failed password for root from ${ip} port ${51000+i} ssh2`);
        document.getElementById("logBox").value = lines.join("\n");
        let idx = 0;
        const t = setInterval(() => { if (idx < lines.length) { processLine(lines[idx++]); } else clearInterval(t); }, 320);
    }

    function clearLive() { document.getElementById("terminalStream").innerHTML = `<div class="s-ok">[ENGINE] Stream cleared.</div>`; }
    updateUI();
</script>
</body>
</html>
