<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisSSH | Forensic Incident Logs</title>
    <style>
        :root { --bg: #050a18; --card: #0c152c; --border: #1b2c52; --cyan: #00f5d4; --crimson: #ff2a5f; --amber: #ffbe0b; --text: #f1f5f9; --muted: #8b9ec2; }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); }
        nav { background: #081024; border-bottom: 1px solid var(--border); padding: 15px 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: var(--text); text-decoration: none; }
        .logo span { color: var(--cyan); }
        .links { display: flex; gap: 12px; }
        .links a { color: var(--muted); text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; }
        .links a.active, .links a:hover { background: rgba(0, 245, 212, 0.12); color: var(--cyan); border: 1px solid rgba(0, 245, 212, 0.35); }
        .container { max-width: 1150px; margin: 28px auto; padding: 0 20px; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        button { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; background: var(--cyan); color: #050a18; margin-left: 8px; }
        .btn-reset { background: #142140; color: var(--text); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--cyan); background: #081024; text-transform: uppercase; font-size: 12px; }
        .crit { color: var(--crimson); font-weight: 800; }
        .high { color: var(--amber); font-weight: 800; }
    </style>
</head>
<body>
<nav>
    <a href="index.html" class="logo">AEGIS<span>SSH</span> // FORENSICS</a>
    <div class="links">
        <a href="index.html">1. Live Monitor</a>
        <a href="firewall.html">2. Firewall & Whitelist</a>
        <a href="reports.html" class="active">3. Forensic Logs</a>
    </div>
</nav>

<div class="container">
    <div class="panel">
        <div class="top-bar">
            <h2 style="margin:0; font-size:18px;">📋 Recorded SSH Brute Force Incidents</h2>
            <div>
                <button onclick="exportCSV()">📥 Export CSV</button>
                <button class="btn-reset" onclick="wipeAll()">Reset All Data</button>
            </div>
        </div>
        <table>
            <thead><tr><th>Timestamp</th><th>Attacker IP</th><th>Target User</th><th>Severity</th><th>Action Taken</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem("aegisState")) || { threshold: 5, whitelist: ["127.0.0.1"], blocked: [], incidents: [], failed: 0, alerts: 0 };

    function renderTable() {
        const tb = document.getElementById("tableBody");
        if (state.incidents.length === 0) {
            tb.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--muted);">No incidents recorded yet. Go to 'Live Monitor' and run an attack simulation!</td></tr>`;
            return;
        }
        tb.innerHTML = state.incidents.map(r => `<tr>
            <td>${r.time}</td><td><strong>${r.ip}</strong></td><td><code>${r.user}</code></td>
            <td class="${r.sev === 'CRITICAL' ? 'crit' : 'high'}">${r.sev}</td><td>${r.act}</td>
        </tr>`).join("");
    }

    function exportCSV() {
        if (state.incidents.length === 0) { alert("No incidents to export!"); return; }
        let csv = "Timestamp,Attacker_IP,Target_User,Severity,Action_Taken\n";
        state.incidents.forEach(r => csv += `"${r.time}","${r.ip}","${r.user}","${r.sev}","${r.act}"\n`);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
        a.download = "AegisSSH_Incidents.csv";
        a.click();
    }

    function wipeAll() {
        localStorage.removeItem("aegisState");
        state = { threshold: 5, whitelist: ["127.0.0.1"], blocked: [], incidents: [], failed: 0, alerts: 0 };
        renderTable();
    }
    renderTable();
</script>
</body>
</html>
